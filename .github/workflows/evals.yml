# Runs the skill evals through the Claude API and saves a score summary.
# This never runs on its own: start it from the Actions tab with
# "Run workflow". Every run costs money on the API key stored in the
# repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables >
# Actions). The summary is attached to the run as a downloadable file.
name: Evals (run by hand)

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Name for the saved score, usually the version, for example v0.5.0"
        required: true
      cases:
        description: "Optional: only these case ids, separated by spaces (leave empty for all)"
        required: false
        default: ""
      model:
        description: "Model for the skill"
        required: false
        default: "claude-opus-5-5"

permissions:
  contents: read

jobs:
  evals:
    name: Run evals
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LABEL: ${{ inputs.label }}
      CASES: ${{ inputs.cases }}
      MODEL: ${{ inputs.model }}
    steps:
      - name: Check the API key is set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add your API key as the repository secret ANTHROPIC_API_KEY first."
            exit 1
          fi
          if ! printf '%s' "$LABEL" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::The label may only use letters, numbers, dots, dashes, and underscores."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: pip install anthropic

      - name: Run the evals
        run: |
          args=(--save "$LABEL" --model "$MODEL")
          for c in $CASES; do args+=(--case "$c"); done
          python tests/run_evals.py "${args[@]}" | tee eval-output.txt

      - name: Add the score to the run summary
        if: always()
        run: |
          {
            echo "## Eval results: $LABEL"
            echo
            echo '```'
            tail -n 40 eval-output.txt 2>/dev/null || echo "No output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-score-${{ inputs.label }}
          path: tests/evals/results/
          if-no-files-found: warn
