# Runs the same checks as CONTRIBUTING.md, plus the script tests,
# on every pull request and every push to main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    name: Style and structure
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      EX: --exclude-dir=.git --exclude=CONTRIBUTING.md --exclude=ai-patterns.md --exclude=buzzwords.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: No em or en dashes
        run: |
          if grep -rnP '\x{2014}|\x{2013}' --exclude-dir=.git .; then
            echo "::error::Em or en dashes found. Use a comma, colon, period, or plain hyphen."
            exit 1
          fi

      - name: No stock AI words outside the lists that name them
        # The brackets keep this file from matching its own search.
        run: |
          if grep -rniwE "d[e]lve|l[e]verage|s[e]amless|r[o]bust|e[l]evate|u[n]lock|e[m]power|t[a]pestry|game-[c]hanger|cutting-[e]dge|t[e]stament" $EX .; then
            echo "::error::Stock AI words found. See the style rules in CONTRIBUTING.md."
            exit 1
          fi

      - name: No language about fooling AI checkers
        # The brackets keep this file from matching its own search.
        run: |
          if grep -rniE "gpt[z]ero|turn[i]tin|undetect[a]ble|by[p]ass|100% hu[m]an|ai detec[t]or" --exclude-dir=.git .; then
            echo "::error::Checker language found. See the ethics rules in CONTRIBUTING.md."
            exit 1
          fi

      - name: Skill name matches the folder
        run: |
          grep -q "^name: write-like-human$" write-like-human/SKILL.md

      - name: Skill description is under 1024 characters
        run: |
          len=$(awk '/^description:/{sub(/^description: /,""); print length($0)}' write-like-human/SKILL.md)
          echo "Description length: $len"
          [ "$len" -le 1024 ]

      - name: Every module is linked from SKILL.md
        run: |
          missing=0
          cd write-like-human/references
          for f in $(find . -name '*.md' | sed 's|^\./||'); do
            case "$f" in
              */index.md) continue ;;
              languages/*) name="${f#languages/}"; where="../SKILL.md" ;;
              writing/*) name="(${f#writing/})"; where="../SKILL.md writing/index.md" ;;
              *) name="$f"; where="../SKILL.md" ;;
            esac
            if ! grep -qF "$name" $where; then
              echo "::error::$f is not linked from SKILL.md or an index it links to"
              missing=1
            fi
          done
          exit $missing

      - name: Every module has the standard sections
        shell: python
        run: |
          import glob, sys
          need = ["## When this applies", "## What stays the same", "## Steps", "## Output", "## Example"]
          skip = ("ai-patterns.md", "voice/voice-profile-template.md")
          bad = 0
          for path in sorted(glob.glob("write-like-human/references/**/*.md", recursive=True)):
              rel = path.split("references/", 1)[1]
              if rel in skip or rel.startswith("lists/") or rel.endswith("-template.md") or rel.endswith("/index.md"):
                  continue
              text = open(path, encoding="utf-8").read()
              heads = [line.strip() for line in text.splitlines() if line.startswith("## ")]
              missing = [n for n in need if not any(h == n or h.startswith(n + " ") for h in heads)]
              if missing:
                  print("::error file=%s::missing %s" % (path, ", ".join(missing)))
                  bad = 1
          sys.exit(bad)

      - name: Translated pages and examples are up to date
        run: python3 docs/_build/sync_site.py --check

      - name: Changelog and plugin version agree
        shell: python
        run: |
          import json, re, sys
          log = open("CHANGELOG.md", encoding="utf-8").read()
          errors = []
          if "## [Unreleased]" not in log:
              errors.append("CHANGELOG.md has no [Unreleased] section")
          versions = re.findall(r"^## \[(\d+\.\d+\.\d+)\]", log, re.M)
          if not versions:
              errors.append("CHANGELOG.md has no released versions")
          else:
              newest = versions[0]
              start = log.index("## [%s]" % newest)
              nxt = log.find("\n## [", start + 5)
              section = log[start: nxt if nxt != -1 else len(log)]
              if not re.search(r"^- ", section, re.M):
                  errors.append("The %s section of CHANGELOG.md has no entries" % newest)
              if not re.search(r"^\[%s\]: " % re.escape(newest), log, re.M):
                  errors.append("CHANGELOG.md has no link line for [%s] at the bottom" % newest)
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          entry = next((p for p in market.get("plugins", []) if p.get("name") == "write-like-human"), None)
          if entry is None:
              errors.append("marketplace.json does not list the write-like-human plugin")
          elif versions and entry.get("version") != versions[0]:
              errors.append(".claude-plugin/marketplace.json version %s does not match the newest CHANGELOG version %s"
                            % (entry.get("version"), versions[0]))
          for e in errors:
              print("::error::" + e)
          sys.exit(1 if errors else 0)

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the libraries claude.ai provides, plus reportlab to build test PDFs
        run: pip install python-docx openpyxl python-pptx pypdf reportlab

      - name: Run tests
        run: python -m unittest discover -s tests -v

  site:
    name: Website fits phone screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Playwright with Chromium and WebKit
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit

      - name: Check the landing page at phone, tablet, and desktop sizes
        run: node tests/site_layout.mjs
