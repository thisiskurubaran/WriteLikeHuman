# Keeps the GitHub Actions used by the workflows up to date. The actions
# are pinned to exact commits for safety, and Dependabot opens a pull
# request when a newer version comes out, so the pins don't go stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
